# Integration-test settings. The datasource comes from Testcontainers (@ServiceConnection).
spring:
  jpa:
    properties:
      # statement counts for BR-ACH-07
      hibernate.generate_statistics: true
  ai:
    openai:
      api-key: test-dummy-groq-key
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b

app:
  limits:
    generations-per-day: 10
    chat-per-hour: 30
    ai-timeout: 2s
  jwt:
    # 32-byte base64 key used only in tests
    secret: 4JBzn+VDduZQFSMTvQYPUj0O78ZjVjIPdf2kRGvppxY=
    expiration-ms: 3600000
  osm:
    user-agent: "NutriCook-Test"
    # never reached by tests: nothing listens on port 9
    overpass-urls: http://localhost:9/api/interpreter
    search-radius-meters: 2000
  cache:
    location-ttl-minutes: 60

logging:
  level:
    # statistics are read in tests, not logged per session
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
