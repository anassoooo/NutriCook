spring:
  application:
    name: nutricook-backend
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    # Schema is owned by Flyway (Constitution VI): Hibernate only validates, in every profile.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${GROQ_API_KEY:dummy-key-replace-me}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: 0.7
          max-tokens: 1024

server:
  # hosts such as Render pass the port in PORT
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # health is public; everything else is for admins (SecurityConfig)
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # every line carries the request id (CorrelationIdFilter)
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    # Base64, at least 32 bytes. The default is for local development only; prod refuses it.
    secret: ${JWT_SECRET:bnV0cmljb29rLWxvY2FsLWRldi1vbmx5LXNlY3JldC1DSEFOR0UtTUUtMDAwMQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # comma-separated; the Vite dev server and the Compose frontend by default
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  demo:
    # local and docker profiles only; no admin is created without a password
    admin-email: ${DEMO_ADMIN_EMAIL:admin@nutricook.local}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
  osm:
    # OpenStreetMap's public servers ask for an identifying user agent with a contact
    user-agent: ${OSM_USER_AGENT:NutriCook diet assistant}
    # tried in order: the main public server, then a mirror (comma-separated)
    overpass-urls: ${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter}
    search-radius-meters: 2000
  cache:
    location-ttl-minutes: 60
  # Business rule tunables (docs/domain/business-rules.md section 13). Change the catalogue first.
  nutrition:
    goal-adjustment:            # BR-NRG-03, kcal/day
      lose: -500
      gain: 300
    min-kcal:                   # BR-NRG-04
      male: 1500
      other: 1200
    protein-per-kg:             # BR-MAC-02, g per kg body weight
      lose: 1.8
      gain: 2.0
      maintain: 1.2
      improve: 1.0
    protein-max-per-kg: 2.2     # BR-MAC-02 cap
    protein-max-energy-share: 0.35
    fat-energy-share: 0.30      # BR-MAC-03
    fat-min-per-kg: 0.6
    fiber-per-1000-kcal: 14     # BR-MAC-05
    slot-shares:                # BR-CMP-01, must sum to 1.0
      BREAKFAST: 0.25
      MORNING_SNACK: 0.10
      LUNCH: 0.30
      AFTERNOON_SNACK: 0.10
      DINNER: 0.25
    tolerance:                  # BR-CMP-05
      day-ok: 0.05
      day-max: 0.10
      meal: 0.15
    composer-max-attempts: 50
  tracking:
    backfill-days: 30           # BR-PRG-02
    hydration-day-ml: 2000      # BR-ACH-04
  limits:
    generations-per-day: 10     # BR-LIF-06
    chat-per-hour: 30           # BR-AI-07
    ai-timeout: 10s             # BR-AI-05

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

---
# Local development: PostgreSQL from `docker compose up db` (host port 5433)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nutricook}
    username: ${DATABASE_USERNAME:nutricook}
    password: ${DATABASE_PASSWORD:nutricook}

---
# Docker Compose: backend container talks to the "db" service
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/nutricook}
    username: ${DATABASE_USERNAME:nutricook}
    password: ${DATABASE_PASSWORD:nutricook}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5

# behind the host's HTTPS proxy: trust X-Forwarded-* for scheme and client address
server:
  forward-headers-strategy: framework

# API documentation is for development only
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
