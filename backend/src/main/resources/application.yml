spring:
  application:
    name: nutricook-backend
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    # Schema is owned by Flyway (Constitution VI): Hibernate only validates, in every profile.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${GROQ_API_KEY:dummy-key-replace-me}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:llama-3.3-70b-versatile}
          temperature: 0.7
          max-tokens: 1024

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:devOnlySecretKeyMustBeAtLeast32CharactersLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  osm:
    user-agent: "NutriCook Diet Assistant / anasbougrine63@gmail.com"
    overpass-url: https://overpass-api.de/api/interpreter
    nominatim-url: https://nominatim.openstreetmap.org
    search-radius-meters: 2000
  cache:
    location-ttl-minutes: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs

---
# Local development: PostgreSQL from `docker compose up db` (host port 5433)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/nutricook}
    username: ${DATABASE_USERNAME:nutricook}
    password: ${DATABASE_PASSWORD:nutricook}

---
# Docker Compose: backend container talks to the "db" service
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/nutricook}
    username: ${DATABASE_USERNAME:nutricook}
    password: ${DATABASE_PASSWORD:nutricook}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
