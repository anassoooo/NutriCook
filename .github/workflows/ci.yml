name: CI

on:
  push:
    branches: [main, "[0-9][0-9][0-9]-*", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check formatting (google-java-format)
        run: ./mvnw -B -q com.spotify.fmt:fmt-maven-plugin:check
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: No hard-coded nutrition targets (Constitution VIII, BR-PRF-08)
        run: |
          if grep -rnE 'max=\{[0-9]+\}|/ ?(2200|2500)\b|2,200' src/pages; then
            echo "::error::Targets must come from the API, not constants in the UI"
            exit 1
          fi
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  traceability:
    name: Business-rule test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report mode for now; task T085 switches this to --enforce
      - run: bash scripts/check-br-coverage.sh

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
